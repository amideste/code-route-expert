const MOIS = ["Janvier","Février","Mars","Avril","Mai","Juin","Juillet","Août","Septembre","Octobre","Novembre","Décembre"];
function grouper(entries){
  if(!entries.length) return `<p class="mut">Aucune entrée pour l'instant.</p>`;
  const tree = {};
  [...entries].sort((a,b)=>a.t-b.t).forEach(e=>{
    const d = new Date(e.t), y = d.getFullYear(), m = d.getMonth(), j = d.getDate();
    tree[y] = tree[y] || {}; tree[y][m] = tree[y][m] || {}; (tree[y][m][j] = tree[y][m][j] || []).push(e);
  });
  return Object.keys(tree).sort((a,b)=>a-b).map(y =>
    `<details open><summary><b>${y}</b></summary>` +
    Object.keys(tree[y]).sort((a,b)=>a-b).map(m =>
      `<details><summary>${MOIS[m]}</summary>` +
      Object.keys(tree[y][m]).sort((a,b)=>a-b).map(j =>
        `<details><summary>Jour ${String(j).padStart(2,"0")}</summary><table>` +
        tree[y][m][j].map(e => `<tr><td>${new Date(e.t).toLocaleTimeString("fr-FR")}</td><td>${esc(e.qui)}</td><td>${esc(e.detail)}</td><td>${e.ok?"OK":"Échec"}</td></tr>`).join("") +
        `</table></details>`).join("") +
      `</details>`).join("") +
    `</details>`).join("");
}

/* Musique douce d'ambiance : démarre à l'ouverture, s'arrête au premier clic sur un bouton */
let musique = null, musiqueArretee = false;
// Musique polyphonique : mélodie, accords et basse jouent ensemble, en boucle de 4 mesures
const ACCORDS = [[261.63,329.63,392.00],[220.00,261.63,329.63],[349.23,440.00,523.25],[392.00,493.88,587.33]];
const BASSES  = [130.81,110.00,87.31,98.00];
const MELODIE = [[659.25,783.99,523.25,783.99],[440.00,523.25,659.25,523.25],[698.46,440.00,523.25,440.00],[392.00,493.88,587.33,493.88]];
function noteMusique(ctx, dest, f, debut, duree, type, volume){
  const o = ctx.createOscillator(); o.type = type; o.frequency.value = f;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0, debut);
  g.gain.linearRampToValueAtTime(volume, debut + 0.04);
  g.gain.linearRampToValueAtTime(0, debut + duree);
  o.connect(g); g.connect(dest);
  o.start(debut); o.stop(debut + duree + 0.05);
}
function frappeBatterie(ctx, dest, quand, buf){
  const src = ctx.createBufferSource(); src.buffer = buf;
  const filtre = ctx.createBiquadFilter(); filtre.type = "highpass"; filtre.frequency.value = 7000;
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.05, quand); g.gain.exponentialRampToValueAtTime(0.001, quand + 0.05);
  src.connect(filtre); filtre.connect(g); g.connect(dest);
  src.start(quand); src.stop(quand + 0.06);
}
function grosseCaisse(ctx, dest, quand){
  const o = ctx.createOscillator(); o.type = "sine";
  o.frequency.setValueAtTime(150, quand); o.frequency.exponentialRampToValueAtTime(40, quand + 0.12);
  const g = ctx.createGain();
  g.gain.setValueAtTime(0.6, quand); g.gain.exponentialRampToValueAtTime(0.001, quand + 0.25);
  o.connect(g); g.connect(dest);
  o.start(quand); o.stop(quand + 0.3);
}
// Une demi-pulsation : batterie, basse, mélodie et accords en rythme (dansant)
function jouerDemi(ctx, dest, h, quand, temps, buf){
  const t = Math.floor(h / 2), contretemps = h % 2 === 1;
  const mesure = Math.floor(t / 4) % 4, tm = t % 4, demi = temps / 2;
  frappeBatterie(ctx, dest, quand, buf);
  if(!contretemps){
    if(tm === 0 || tm === 2) grosseCaisse(ctx, dest, quand);
    noteMusique(ctx, dest, BASSES[mesure], quand, temps * 0.45, "triangle", 0.14);
    noteMusique(ctx, dest, MELODIE[mesure][tm], quand, temps * 0.45, "triangle", 0.10);
  } else {
    ACCORDS[mesure].forEach(f => noteMusique(ctx, dest, f, quand, demi * 0.5, "sine", 0.045));
    noteMusique(ctx, dest, MELODIE[mesure][tm] * 2, quand, demi * 0.4, "sine", 0.03);
  }
}
function demarrerMusique(){
  if(musique || musiqueArretee) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    const master = ctx.createGain();
    master.gain.value = 0;
    master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(0.8, ctx.currentTime + 2);
    const buf = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.06), ctx.sampleRate);
    const donnees = buf.getChannelData(0);
    for(let k = 0; k < donnees.length; k++) donnees[k] = Math.random() * 2 - 1;
    const temps = 60 / 108;               // tempo dansant : 108 battements par minute
    const demi = temps / 2;
    let prochain = ctx.currentTime + 0.1, h = 0;
    const timer = setInterval(() => {
      while(prochain < ctx.currentTime + 0.25){
        jouerDemi(ctx, master, h, prochain, temps, buf);
        prochain += demi; h++;
      }
    }, 100);
    if(ctx.state === "suspended") ctx.resume();
    musique = {ctx: ctx, master: master, timer: timer};
  }catch(e){}
}
function arreterMusique(){
  musiqueArretee = true;
  if(!musique) return;
  const m = musique; musique = null;
  clearInterval(m.timer);
  m.master.gain.linearRampToValueAtTime(0, m.ctx.currentTime + 0.8);
  setTimeout(() => m.ctx.close(), 900);
}
function majBoutonMusique(){
  const b = document.getElementById("musique-toggle"); if(!b) return;
  b.style.opacity = musique ? "1" : "0.5";
  b.title = musique ? "Arrêter la musique" : "Activer la musique";
}
function basculerMusique(){
  if(musique){ arreterMusique(); }
  else { musiqueArretee = false; demarrerMusique(); }
  majBoutonMusique();
}
window.addEventListener("load", demarrerMusique);
// Si le navigateur bloque le son automatique, la musique démarre au premier toucher de l'écran (hors bouton)
document.addEventListener("pointerdown", e => { if(!e.target.closest("button")) demarrerMusique(); }, true);
// Premier clic sur un bouton : la musique s'arrête
document.addEventListener("click", e => { if(e.target.closest("button") && !e.target.closest("#musique-toggle")) { arreterMusique(); majBoutonMusique(); } }, true);
